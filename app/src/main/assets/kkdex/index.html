        Calculator: {
            expression: '',
            result: '0',
            justEvaluated: false,

            render() {
                return `<div class="calculator-app">
                    <div class="calc-display">
                        <div class="calc-expression" id="calc-expression"></div>
                        <div class="calc-result" id="calc-result">0</div>
                    </div>
                    <div class="calc-buttons">
                        <div class="calc-btn func" data-action="clear">AC</div>
                        <div class="calc-btn func" data-action="toggle">±</div>
                        <div class="calc-btn func" data-action="percent">%</div>
                        <div class="calc-btn operator" data-action="÷">÷</div>
                        <div class="calc-btn" data-action="7">7</div>
                        <div class="calc-btn" data-action="8">8</div>
                        <div class="calc-btn" data-action="9">9</div>
                        <div class="calc-btn operator" data-action="×">×</div>
                        <div class="calc-btn" data-action="4">4</div>
                        <div class="calc-btn" data-action="5">5</div>
                        <div class="calc-btn" data-action="6">6</div>
                        <div class="calc-btn operator" data-action="-">−</div>
                        <div class="calc-btn" data-action="1">1</div>
                        <div class="calc-btn" data-action="2">2</div>
                        <div class="calc-btn" data-action="3">3</div>
                        <div class="calc-btn operator" data-action="+">+</div>
                        <div class="calc-btn" data-action="0" style="grid-column:span 2;">0</div>
                        <div class="calc-btn" data-action=".">.</div>
                        <div class="calc-btn equals" data-action="=">=</div>
                    </div>
                </div>`;
            },

            initEvents(winId) {
                const body = document.getElementById(`window-body-${winId}`);
                if (!body) return;

                this.expression = '';
                this.result = '0';

                body.querySelectorAll('.calc-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.handleInput(btn.dataset.action, body);
                    });
                });
            },

            handleInput(action, body) {
                const exprEl = body.querySelector('#calc-expression');
                const resEl = body.querySelector('#calc-result');

                if (action === 'clear') {
                    this.expression = '';
                    this.result = '0';
                } else if (action === '=') {
                    try {
                        let expr = this.expression
                            .replace(/×/g, '*')
                            .replace(/÷/g, '/')
                            .replace(/−/g, '-');
                        let res = Function('"use strict"; return (' + expr + ')')();
                        this.result = String(parseFloat(res.toFixed(10)));
                        this.expression = this.result;
                        this.justEvaluated = true;
                    } catch(e) {
                        this.result = 'Error';
                    }
                } else if (action === 'toggle') {
                    if (this.result !== '0' && this.result !== 'Error') {
                        this.result = String(-parseFloat(this.result));
                        this.expression = this.result;
                    }
                } else if (action === 'percent') {
                    if (this.result !== 'Error') {
                        this.result = String(parseFloat(this.result) / 100);
                        this.expression = this.result;
                    }
                } else if (['+', '-', '×', '÷', '−'].includes(action)) {
                    this.justEvaluated = false;
                    this.expression += ' ' + action + ' ';
                    this.result = this.expression;
                } else {
                    if (this.justEvaluated) {
                        this.expression = '';
                        this.result = '0';
                        this.justEvaluated = false;
                    }
                    if (this.expression === '0') this.expression = '';
                    this.expression += action;
                    this.result = this.expression;
                }

                if (exprEl) exprEl.textContent = this.expression;
                if (resEl) resEl.textContent = this.result;
            }
        },

        // ---- TERMINAL APP ----
        Terminal: {
            history: [],

            render() {
                return `<div class="terminal-app">
                    <div class="terminal-output" id="terminal-output">
                        <div class="terminal-line"><span class="output">KK Dex Terminal v1.0.0</span></div>
                        <div class="terminal-line"><span class="output">Type 'help' for available commands.</span></div>
                        <div class="terminal-line"><span class="output">&nbsp;</span></div>
                    </div>
                    <div class="terminal-input-line">
                        <span class="terminal-prompt">kk-user@dex:~$</span>
                        <input type="text" class="terminal-input" id="terminal-input" autofocus>
                    </div>
                </div>`;
            },

            initEvents(winId) {
                const body = document.getElementById(`window-body-${winId}`);
                if (!body) return;

                const input = body.querySelector('#terminal-input');
                const output = body.querySelector('#terminal-output');

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const cmd = input.value.trim();
                        if (!cmd) return;

                        // Show command
                        output.innerHTML += `<div class="terminal-line"><span class="prompt">kk-user@dex:~$ </span><span class="command">${cmd}</span></div>`;

                        // Process command
                        const result = this.processCommand(cmd);
                        if (result) {
                            output.innerHTML += `<div class="terminal-line"><span class="${result.type || 'output'}">${result.text}</span></div>`;
                        }

                        input.value = '';
                        output.scrollTop = output.scrollHeight;
                        this.history.push(cmd);
                    }
                });

                input.focus();
            },

            processCommand(cmd) {
                const parts = cmd.toLowerCase().split(' ');
                const command = parts[0];

                switch(command) {
                    case 'help':
                        return { text: 'Available commands: help, echo, date, clear, whoami, uname, ls, pwd, neofetch, theme, version', type: 'output' };
                    case 'echo':
                        return { text: parts.slice(1).join(' '), type: 'output' };
                    case 'date':
                        return { text: new Date().toString(), type: 'output' };
                    case 'whoami':
                        return { text: 'kk-user', type: 'output' };
                    case 'uname':
                        return { text: 'KK Dex 1.0.0 (Desktop Environment)', type: 'output' };
                    case 'pwd':
                        return { text: '/home/kk-user', type: 'output' };
                    case 'ls':
                        return { text: 'Documents  Downloads  Pictures  Music  Videos  Desktop', type: 'output' };
                    case 'clear':
                        const output = document.querySelector('#terminal-output');
                        if (output) output.innerHTML = '';
                        return null;
                    case 'version':
                        return { text: 'KK Dex Desktop Environment v1.0.0\nBuild: 2024.01.001', type: 'output' };
                    case 'theme':
                        if (parts[1] === 'dark') { KKDex.applyTheme('dark'); return { text: 'Theme changed to dark', type: 'output' }; }
                        if (parts[1] === 'light') { KKDex.applyTheme('light'); return { text: 'Theme changed to light', type: 'output' }; }
                        return { text: 'Usage: theme [dark|light]', type: 'output' };
                    case 'neofetch':
                        return { text: `
  ⬡ KK Dex Desktop
  ─────────────────
  OS: KK Dex 1.0.0
  Host: Web Browser
  Resolution: ${window.innerWidth}x${window.innerHeight}
  Theme: ${KKDex.state.theme}
  Wallpaper: ${KKDex.state.wallpaper}
  Windows: ${KKDex.state.windows.length}
  Uptime: Active`, type: 'output' };
                    default:
                        return { text: `command not found: ${command}`, type: 'error' };
                }
            }
        }
    },

    // ============================================
    // CONTROLLER API (Phone Controller Integration)
    // ============================================
    ControllerAPI: {
        init() {
            window.KKDexAPI = {
                movePointer: (x, y) => this.movePointer(x, y),
                pointerDown: (x, y) => this.pointerDown(x, y),
                pointerUp: (x, y) => this.pointerUp(x, y),
                pointerClick: (x, y) => this.pointerClick(x, y),
                pointerDoubleClick: (x, y) => this.pointerDoubleClick(x, y),
                pointerRightClick: (x, y) => this.pointerRightClick(x, y),
                scrollDesktop: (dx, dy) => this.scrollDesktop(dx, dy),
                insertText: (text) => this.insertText(text),
                pressKey: (key) => this.pressKey(key),
                getState: () => this.getState(),
                openApp: (appId) => KKDex.openApp(appId),
                setTheme: (theme) => KKDex.applyTheme(theme),
                setWallpaper: (wp) => KKDex.applyWallpaper(wp),
            };
            console.log('KKDex Controller API ready. Access via window.KKDexAPI');
        },

        movePointer(x, y) {
            const pointer = document.getElementById('custom-pointer');
            if (pointer) {
                pointer.style.display = 'block';
                pointer.style.left = x + 'px';
                pointer.style.top = y + 'px';
            }
            const el = document.elementFromPoint(x, y);
            if (el) {
                el.dispatchEvent(new MouseEvent('mousemove', {
                    clientX: x, clientY: y, bubbles: true
                }));
            }
        },

        pointerDown(x, y) {
            this.movePointer(x, y);
            const el = document.elementFromPoint(x, y);
            if (el) {
                el.dispatchEvent(new MouseEvent('mousedown', { clientX: x, clientY: y, bubbles: true }));
            }
        },

        pointerUp(x, y) {
            const el = document.elementFromPoint(x, y);
            if (el) {
                el.dispatchEvent(new MouseEvent('mouseup', { clientX: x, clientY: y, bubbles: true }));
            }
        },

        pointerClick(x, y) {
            this.movePointer(x, y);
            const el = document.elementFromPoint(x, y);
            if (el) {
                if (el.matches('input, textarea, [contenteditable="true"]')) el.focus();
                el.dispatchEvent(new MouseEvent('click', { clientX: x, clientY: y, bubbles: true }));
            }
        },

        pointerDoubleClick(x, y) {
            this.movePointer(x, y);
            const el = document.elementFromPoint(x, y);
            if (el) {
                el.dispatchEvent(new MouseEvent('dblclick', { clientX: x, clientY: y, bubbles: true }));
            }
        },

        pointerRightClick(x, y) {
            this.movePointer(x, y);
            const el = document.elementFromPoint(x, y);
            if (el) {
                el.dispatchEvent(new MouseEvent('contextmenu', { clientX: x, clientY: y, bubbles: true }));
            }
        },

        scrollDesktop(dx, dy) {
            const focused = document.querySelector('.app-window.focused .window-body');
            if (focused) {
                focused.scrollBy(dx, dy);
            } else {
                window.scrollBy(dx, dy);
            }
        },

        insertText(text) {
            const active = document.activeElement;
            if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
                const start = active.selectionStart;
                const end = active.selectionEnd;
                active.value = active.value.substring(0, start) + text + active.value.substring(end);
                active.selectionStart = active.selectionEnd = start + text.length;
                active.dispatchEvent(new Event('input', { bubbles: true }));
            }
        },

        pressKey(key) {
            document.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
            setTimeout(() => {
                document.dispatchEvent(new KeyboardEvent('keyup', { key, bubbles: true }));
            }, 50);
        },

        getState() {
            return {
                theme: KKDex.state.theme,
                wallpaper: KKDex.state.wallpaper,
                openWindows: KKDex.state.windows.map(w => ({
                    id: w.id,
                    appId: w.appId,
                    title: w.title,
                    minimized: w.minimized,
                    maximized: w.maximized,
                    focused: w.id === KKDex.state.focusedWindowId,
                })),
                screenSize: { width: window.innerWidth, height: window.innerHeight },
            };
        }
    }
};

// Gallery click binding (needs to be done after DOM and app init)
document.addEventListener('click', (e) => {
    const galleryItem = e.target.closest('.gallery-item');
    if (galleryItem) {
        const imgId = parseInt(galleryItem.dataset.imgid);
        KKDex.Apps.Gallery.openViewer(imgId);
    }

    // App Center "Get" button
    const acBtn = e.target.closest('.ac-btn');
    if (acBtn) {
        if (acBtn.textContent === 'Get') {
            acBtn.textContent = 'Installing...';
            acBtn.style.background = 'var(--text-tertiary)';
            setTimeout(() => {
                acBtn.textContent = 'Open';
                acBtn.style.background = 'var(--success)';
            }, 1500);
        } else if (acBtn.textContent === 'Open') {
            acBtn.textContent = 'Opened';
        }
    }

    // App Center category filter
    const acCat = e.target.closest('.appcenter-cat');
    if (acCat) {
        const container = acCat.parentElement;
        container.querySelectorAll('.appcenter-cat').forEach(c => c.classList.remove('active'));
        acCat.classList.add('active');
        const cat = acCat.dataset.cat;
        const content = document.getElementById('appcenter-content');
        if (content) {
            const filtered = cat === 'All' ? KKDex.Apps.AppCenter.catalog : KKDex.Apps.AppCenter.catalog.filter(a => a.cat === cat);
            content.innerHTML = `
                <div class="appcenter-section-title">${cat === 'All' ? 'Featured Apps' : cat}</div>
                <div class="appcenter-grid">${filtered.map(app => `
                    <div class="appcenter-card">
                        <div class="ac-icon" style="background:${app.bg}">${app.icon}</div>
                        <div class="ac-info">
                            <div class="ac-name">${app.name}</div>
                            <div class="ac-dev">${app.dev}</div>
                            <div class="ac-rating">${app.rating}</div>
                        </div>
                        <div class="ac-btn">Get</div>
                    </div>
                `).join('')}</div>`;
        }
    }
});

// App Center search
document.addEventListener('input', (e) => {
    if (e.target.id === 'appcenter-search') {
        const q = e.target.value.toLowerCase();
        const content = document.getElementById('appcenter-content');
        if (content) {
            const filtered = KKDex.Apps.AppCenter.catalog.filter(a =>
                a.name.toLowerCase().includes(q) || a.dev.toLowerCase().includes(q) || a.cat.toLowerCase().includes(q)
            );
            content.innerHTML = `
                <div class="appcenter-section-title">${q ? 'Search Results' : 'Featured Apps'}</div>
                <div class="appcenter-grid">${filtered.map(app => `
                    <div class="appcenter-card">
                        <div class="ac-icon" style="background:${app.bg}">${app.icon}</div>
                        <div class="ac-info">
                            <div class="ac-name">${app.name}</div>
                            <div class="ac-dev">${app.dev}</div>
                            <div class="ac-rating">${app.rating}</div>
                        </div>
                        <div class="ac-btn">Get</div>
                    </div>
                `).join('')}</div>`;
        }
    }
});

// Initialize drag/resize handling
KKDex._initDragResize();

// Boot the desktop
document.addEventListener('DOMContentLoaded', () => {
    KKDex.init();
});

// Fallback if DOMContentLoaded already fired
if (document.readyState !== 'loading') {
    KKDex.init();
}
</script>
</body>
</html>
