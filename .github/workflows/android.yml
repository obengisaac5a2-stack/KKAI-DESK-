          patch("src/apps/Connected.tsx",
          '''  useEffect(() => {
                    if (!loading) return;
                    const timer = setTimeout(() => setLoading(false), 7000);
                    return () => clearTimeout(timer);
                  }, [loading, url]);''',
          '''  useEffect(() => {
                    if (isHome || !nativeAvailable() || !window.KKDexServices?.openBrowser) return;
                    void Promise.resolve(window.KKDexServices.openBrowser(url)).catch((cause) =>
                      explain("Could not open the TV browser", cause instanceof Error ? cause.message : String(cause)),
