name: Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack the latest supplied KK DEX desktop source
        run: |
          ZIP_FILE="kk-dex-desktop-os-development (3).zip"
          test -s "$ZIP_FILE"
          mkdir -p desktop-source
          unzip -q "$ZIP_FILE" -d desktop-source

      - name: Connect App Center to real Android applications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          types = Path('desktop-source/src/types.ts')
          t = types.read_text()
          t = t.replace('      requestStorageAccess?: () => Promise<boolean>;', '      requestStorageAccess?: () => Promise<boolean>;\n      getInstalledApps?: () => Promise<Array<{ packageName: string; name: string }>>;\n      launchAndroidApp?: (packageName: string) => Promise<boolean>;')
          types.write_text(t)
          app = Path('desktop-source/src/apps/Connected.tsx')
          a = app.read_text()
          a = a.replace('  const [category, setCategory] = useState("All apps");', '  const [category, setCategory] = useState("All apps");\n  const [androidApps, setAndroidApps] = useState<Array<{packageName: string; name: string}>>([]);\n  const [androidAppsError, setAndroidAppsError] = useState("");\n  useEffect(() => { window.KKDexServices?.getInstalledApps?.().then(setAndroidApps).catch(() => setAndroidAppsError("Could not read installed Android apps.")); }, []);\n  const launchAndroid = async (packageName: string) => { const ok = await window.KKDexServices?.launchAndroidApp?.(packageName); if (!ok) setAndroidAppsError("Android could not launch that application."); };')
          section = '<section className="app-center-footer"><strong>Android applications installed on your phone</strong><p>Launch real Android apps from KK DEX.</p><button onClick={() => window.KKDexServices?.getInstalledApps?.().then(setAndroidApps)}>Refresh apps</button>{androidAppsError && <p role="status">{androidAppsError}</p>}<div>{androidApps.map(app => <button key={app.packageName} onClick={() => launchAndroid(app.packageName)}><strong>{app.name}</strong> — Open Android app</button>)}</div></section><div className="app-center-footer">'
          a = a.replace('      <div className="app-center-footer">', section)
          app.write_text(a)
          files = Path('desktop-source/src/apps/Files.tsx')
          f = files.read_text()
          f = f.replace('Permission granted. The native host must provide a storage picker or file provider to browse device files.', 'Android folder access was granted. Use Import files to choose photos, videos, music, and documents from the selected location.')
          f = f.replace('Direct device storage is not connected in this environment. Use the Import files action to choose files with the system picker. Native storage access requires an Android Storage Access Framework integration.', 'Choose a folder in the Android picker. After granting access, use Import files to select photos, videos, music, or documents from your phone.')
          files.write_text(f)
          PY
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-source/package-lock.json

      - name: Build the supplied desktop and phone-controller interfaces
        run: |
          cd desktop-source
          python3 - <<'PY'
          from pathlib import Path
          p = Path("vite.config.ts")
          s = p.read_text()
          if "base:" not in s:
              s = s.replace("export default defineConfig({", 'export default defineConfig({\n  base: "./",')
          p.write_text(s)
          PY
          npm ci
          npx tsc --noEmit
          npm run build
          test -s dist/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dist/index.html")
          s = p.read_text()
          bridge = r"""
          <script>
          (() => {
            // Phone controller -> Android host -> external desktop WebView.
            if (new URLSearchParams(window.location.search).has("controller")) {
              window.KKDexControllerBridge = {
                sendInput(message) {
                  try {
                    const parsed = typeof message === "string" ? JSON.parse(message) : message;
                    window.KKDexHost?.postMessage("kkdex-remote", JSON.stringify(parsed));
                  } catch (error) {
                    console.error("KK DEX controller transport error", error);
                  }
                }
              };
            }

            // Native Android services are exposed only to the trusted desktop WebView.
            if (!new URLSearchParams(window.location.search).has("controller") && window.KKDexHost) {
              window.KKDexServices = {
                getInstalledApps: async () => JSON.parse(window.KKDexHost.getInstalledApps() || "[]"),
                launchAndroidApp: async (packageName) => !!window.KKDexHost.launchApp(packageName),
                requestStorageAccess: async () => !!window.KKDexHost.requestStorageAccess()
              };
            }

            // Android host -> desktop app's existing remote-input event handler.
            window.__KKDEX_NATIVE_BROADCAST = (name, json) => {
              if (name !== "kkdex-remote") return;
              let data;
              try { data = JSON.parse(json); } catch (_) { return; }
              window.dispatchEvent(new CustomEvent("kkdex:input", { detail: data }));
            };
          })();
          </script>
          """
          if "__KKDEX_NATIVE_BROADCAST" not in s:
              s = s.replace("<head>", "<head>" + bridge, 1)
          p.write_text(s)
          PY
          mkdir -p ../app/src/main/assets/kkdex
          rm -rf ../app/src/main/assets/kkdex/*
          cp -R dist/. ../app/src/main/assets/kkdex/

      - name: Verify bundled interfaces
        run: |
          test -s app/src/main/assets/kkdex/index.html
          grep -q "__KKDEX_NATIVE_BROADCAST" app/src/main/assets/kkdex/index.html
          grep -q "KKDexControllerBridge" app/src/main/assets/kkdex/index.html
          grep -q "kkdex:input" app/src/main/assets/kkdex/index.html
          echo "Supplied KK DEX interface, controller transport, and desktop input receiver are bundled."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KKAI-DESK-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
