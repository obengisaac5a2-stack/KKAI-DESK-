                if (kind === "archive" && entry.name.toLowerCase().endsWith(".apk")) {
                  try {
                    const result = await installApk(entry.uri);
                    system.notify("Android package installer", result, "appmanager");
                  } catch (cause) { report("Could not start APK installation", cause); }
                  return;
                }
                const payload = encodeAndroidPayload({ ...entry, treeUri });''', "Android Storage APK route")
          patch("src/apps/AndroidApps.tsx",
          '''  const [launching, setLaunching] = useState<string | null>(null);
                const available = nativeAvailable();''',
          '''  const [launching, setLaunching] = useState<string | null>(null);
                const [installing, setInstalling] = useState(false);
                const available = nativeAvailable();''', "App Manager install state")
          patch("src/apps/AndroidApps.tsx",
          '''  const [installing, setInstalling] = useState(false);
                const available = nativeAvailable();

                const load = async () => {''',
          '''  const [installing, setInstalling] = useState(false);
                const available = nativeAvailable();

                const load = async () => {''', "App Manager install state verification")
          patch("src/apps/AndroidApps.tsx",
          '''  const visible = apps.filter((app) => \${app.label} \${app.packageName} .toLowerCase().includes(query.toLowerCase()));''',
          '''  const visible = apps.filter((app) => \${app.label} \${app.packageName} .toLowerCase().includes(query.toLowerCase()));''', "noop visible guard")
          # Insert the APK picker immediately before the App Manager unavailable-state branch.
          patch("src/apps/AndroidApps.tsx",
          '''  if (!available)
                return (
                  <NativeRequired
                    title="Installed apps come from Android."''',
          '''  const installPackage = async () => {
                  setInstalling(true);
                  try {
                    const picked = await pickFiles("application/vnd.android.package-archive");
                    const apk = picked.find((item) => item.name.toLowerCase().endsWith(".apk"));
