                fun openBrowserOnDesktop(url: String): String {
                    val uri = Uri.parse(url)
                    if (uri.scheme != "https" && uri.scheme != "http") throw IllegalArgumentException("Only HTTP and HTTPS websites are allowed.")
                    val active = presentation
                    if (active == null) return openExternalIntent(Intent(Intent.ACTION_VIEW, uri))
                    runOnUiThread { active.openBrowser(url) }
                    return "Opened in the KK DEX browser on the television."
