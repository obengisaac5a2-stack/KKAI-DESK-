name: Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Development 7 AndroidStorageApp and build configuration
        shell: bash
        run: |
          ZIP="kk-dex-desktop-os-development (7).zip"
          mkdir -p "$RUNNER_TEMP/kkdex-development-7"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/kkdex-development-7"
          ROOT="$RUNNER_TEMP/kkdex-development-7"
          echo "===== ANDROID STORAGE APP ====="
          sed -n '145,420p' "$ROOT/src/apps/AndroidApps.tsx"
          echo "===== ANDROID APP GRADLE ====="
          cat "$ROOT/android/app/build.gradle.kts"
          echo "===== ANDROID SETTINGS ====="
          cat "$ROOT/android/settings.gradle.kts"
          echo "===== ROOT BUILD / ASSET SETUP ====="
          cat "$ROOT/android/build.gradle.kts"
          cat "$ROOT/scripts/sync-android-assets.mjs"
          echo "===== NATIVE BRIDGE DISPATCH ====="
          sed -n '285,455p' "$ROOT/android/app/src/main/java/com/kkdex/desktop/NativeBridge.kt"
