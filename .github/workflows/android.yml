name: Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Development 7 storage component routing
        shell: bash
        run: |
          ZIP="kk-dex-desktop-os-development (7).zip"
          mkdir -p "$RUNNER_TEMP/kkdex-development-7"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/kkdex-development-7"
          ROOT="$RUNNER_TEMP/kkdex-development-7"
          echo "===== STORAGE COMPONENT DEFINITIONS ====="
          grep -R -n -C 6 -E "StorageApp|AndroidStorage|function .*Storage|case \"storage\"|appId === \"storage\"|id === \"storage\"|storage ===" "$ROOT/src" || true
          echo "===== APP ROUTING ====="
          cat "$ROOT/src/App.tsx"
          echo "===== FILES APP STORAGE UI ====="
          sed -n '630,900p' "$ROOT/src/apps/Files.tsx"
          echo "===== ANDROID ROOT TYPES ====="
          grep -n -A 35 -B 5 "interface AndroidRoot\|type AndroidRoot\|interface AndroidFileEntry\|type AndroidFileEntry" "$ROOT/src/types.ts"
