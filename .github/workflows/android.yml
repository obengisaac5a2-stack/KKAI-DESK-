                    </div>
                  ) : (
                    <div className="browser-web-content">
                      <div className="browser-embed-notice">''', "native TV browser instead of iframe")
          patch("src/apps/Connected.tsx",
          '''              "The applications shown here are built into this desktop and are ready to open. Installing additional Android applications requires a native package-manager integration, which is not connected in this environment. No installation will be simulated.",''',
          '''              "KK DEX can hand a selected APK to Android's Package Installer. Android verifies the package and asks you to approve installation. Some apps may still refuse to run on an external display.",''', "App Center install explanation")

