name: Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Version 4 KK DEX project
        uses: actions/checkout@v4

      - name: Verify Version 4 desktop interface and Android storage integration
        run: |
          test -s app/src/main/assets/kkdex/index.html
          grep -q "files-phone-storage" app/src/main/assets/kkdex/index.html
          grep -q "getStorageFiles" app/src/main/assets/kkdex/index.html
          grep -q "openStorageFile" app/src/main/assets/kkdex/index.html
          grep -q "getStorageFiles" app/src/main/java/com/kkdesk/MainActivity.kt
          echo "Version 4 desktop interface and Android storage bridge verified."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KKAI-DESK-version-4-storage-fix
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
