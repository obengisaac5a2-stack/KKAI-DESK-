          patch("src/apps/AndroidApps.tsx",
          '''<div><span className="eyebrow">ANDROID PACKAGE MANAGER</span><h1>Installed apps</h1><p>Android controls which applications are visible and where they can launch.</p></div>
                    <button className="secondary-button" onClick={() => void load()} disabled={busy}><RefreshCw size={14} className={busy ? "spin" : ""} /> Refresh</button>''',
          '''<div><span className="eyebrow">ANDROID PACKAGE MANAGER</span><h1>Installed apps</h1><p>Launch installed apps or ask Android to install an APK you select.</p></div>
                    <div style={{ display: "flex", gap: 8 }}>
                      <button className="secondary-button" onClick={() => void installPackage()} disabled={installing}><Upload size={14} /> {installing ? "Opening installer…" : "Install APK"}</button>
                      <button className="secondary-button" onClick={() => void load()} disabled={busy}><RefreshCw size={14} className={busy ? "spin" : ""} /> Refresh</button>
                    </div>''', "App Manager Install APK button")

          patch("src/apps/AndroidApps.tsx",
          '''      const url = await contentUrl(next.treeUri || "", next.uri, next.mime);
                    setEntry(next);
                    setSource(url);
                    setStatus(\`Streaming \${next.name} from its authorized Android URI\`);''',
