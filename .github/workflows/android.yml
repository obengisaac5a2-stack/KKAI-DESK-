                    if (uri.scheme != "content") throw IllegalArgumentException("Select an APK through Android's file picker.")
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && !packageManager.canRequestPackageInstalls()) {
                        runOnUiThread { startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:$packageName"))) }
                        return "Android opened the permission page. Allow KK DEX to install apps, return, and select the APK again."
                    }
                    val intent = Intent(Intent.ACTION_VIEW).setDataAndType(uri, "application/vnd.android.package-archive")
                        .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                    return openExternalIntent(intent)
                }''', "MainActivity native actions")

