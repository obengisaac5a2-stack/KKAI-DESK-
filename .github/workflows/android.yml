              "src/Panels.tsx": ["openWifiSettings", "openBluetoothSettings"],
              "android/app/src/main/java/com/kkdex/desktop/DesktopPresentation.kt": ["fun playVideo", "fun openBrowser", "VideoView"],
              "android/app/src/main/java/com/kkdex/desktop/NativeBridge.kt": ['"playVideoOnDesktop"', '"installApk"', '"openWifiSettings"'],
              "android/app/src/main/AndroidManifest.xml": ["REQUEST_INSTALL_PACKAGES"],
          }
          for rel, needles in required.items():
              source = (root / rel).read_text()
              for needle in needles:
                  if needle not in source: raise SystemExit(f"Development 7 verification failed: {needle} missing from {rel}")
          print("Development 7 native integrations verified.")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Development 7 desktop interface
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm ci
          npm run build
          node scripts/sync-android-assets.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Development 7 Android APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: gradle :app:assembleDebug

      - name: Verify APK output
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          echo "Development 7 APK built successfully."

      - name: Upload Development 7 APK
        uses: actions/upload-artifact@v4
        with:
          name: KKAI-DESK-development-7-storage-fix
          path: ${{ env.PROJECT_ROOT }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
