                    return "Android Bluetooth settings opened. Pair a device, then return to KK DEX."
                }
                fun playVideoOnDesktop(uriValue: String): String {
                    val uri = Uri.parse(uriValue)
                    if (uri.scheme != "content") throw IllegalArgumentException("Only Android-authorized content URIs can be played.")
                    val active = presentation ?: throw IllegalStateException("Connect the television before starting TV video playback.")
                    runOnUiThread { active.playVideo(uri) }
                    return "Video playback was sent to the television display."
                }
                fun stopVideoOnDesktop(): String {
