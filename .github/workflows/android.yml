          import os
          root = Path(os.environ["PROJECT_ROOT"])

          def patch(rel, old, new, label):
              path = root / rel
              source = path.read_text()
              if new in source:
                  print("Already applied:", label)
                  return
              if old not in source:
                  raise SystemExit("Expected source block missing for " + label + "; refusing unsafe patch.")
              path.write_text(source.replace(old, new, 1))
              print("Applied:", label)

          patch("src/android/native.ts",
          '''    openBrowser: async (url: string) => {
                await call("openUrl", { url });
              },
              setVolume: (value: number) => {''',
          '''    openBrowser: async (url: string) => {
                await call("openUrl", { url });
              },
              openWifiSettings: async () => { await call("openWifiSettings"); },
              openBluetoothSettings: async () => { await call("openBluetoothSettings"); },
              setVolume: (value: number) => {''', "native settings methods")

          patch("src/android/native.ts",
          '''export const openDocument = (treeUri: string, uri: string, mime: string) =>
            nativeCall<string>("openDocument", { treeUri, uri, mime });''',
          '''export const openDocument = (treeUri: string, uri: string, mime: string) =>
            nativeCall<string>("openDocument", { treeUri, uri, mime });
          export const installApk = (uri: string) => nativeCall<string>("installApk", { uri });
          export const playVideoOnDesktop = (uri: string) => nativeCall<string>("playVideoOnDesktop", { uri });
          export const stopVideoOnDesktop = () => nativeCall<string>("stopVideoOnDesktop");''', "native APK and TV media functions")

          patch("src/types.ts",
