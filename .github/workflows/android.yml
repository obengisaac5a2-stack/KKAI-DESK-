name: Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Development 7 storage wiring
        shell: bash
        run: |
          ZIP="kk-dex-desktop-os-development (7).zip"
          mkdir -p "$RUNNER_TEMP/kkdex-development-7"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/kkdex-development-7"
          ROOT="$RUNNER_TEMP/kkdex-development-7"
          echo "===== PACKAGE ====="
          cat "$ROOT/package.json"
          echo "===== SOURCE REFERENCES ====="
          grep -R -n -C 7 -E "pickFolder|chooseFolderForDesktop|listDirectory|Android storage|openApp\(['\\\"]storage|KKDexServices" "$ROOT/src/apps" "$ROOT/src/android" "$ROOT/src/system.tsx" "$ROOT/src/registry.ts" || true
          echo "===== NATIVE PICKER ====="
          sed -n '470,585p' "$ROOT/android/app/src/main/java/com/kkdex/desktop/NativeBridge.kt"
          echo "===== STORAGE LISTING ====="
          sed -n '1,125p' "$ROOT/android/app/src/main/java/com/kkdex/desktop/StorageController.kt"
