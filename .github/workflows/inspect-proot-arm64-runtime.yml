name: Inspect Android ARM64 PRoot runtime package

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-proot-arm64-runtime.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned ARM64 PRoot release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proot-inspect"
          cd "$RUNNER_TEMP/proot-inspect"
          curl -fL --retry 3 -o proot-aarch64.zip \
            https://github.com/ahmed-alnassif/proot/releases/download/v26.10.08-a179d3e/proot-aarch64.zip
          echo "d621d71fb68bf07accbada37ffc4208cf4a963eed70916ee68f848cbd9555cc3  proot-aarch64.zip" | sha256sum -c -
          unzip -t proot-aarch64.zip
          unzip -q proot-aarch64.zip -d extracted
          echo "===== Archive contents ====="
          find extracted -type f -printf '%P %s bytes\n' | sort
          echo "===== Executable metadata ====="
          find extracted -type f -exec file {} \;
          echo "===== ELF dynamic dependencies ====="
          find extracted -type f -exec sh -c '
            for f do
              if readelf -h "$f" >/dev/null 2>&1; then
                echo "--- $f"
                readelf -h "$f" | grep -E "Class:|Machine:"
                readelf -d "$f" 2>/dev/null | grep NEEDED || true
              fi
            done
          ' sh {} +
          cp proot-aarch64.zip "$GITHUB_WORKSPACE/"
          cp -R extracted "$GITHUB_WORKSPACE/proot-runtime-inspection"
      - name: Upload inspected runtime package
        uses: actions/upload-artifact@v4
        with:
          name: KK-DEX-proot-arm64-runtime-inspection
          path: |
            proot-aarch64.zip
            proot-runtime-inspection/
          if-no-files-found: error
          retention-days: 7
