name: KK DEX Development 10 APK

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android-development-10.yml"
      - "kk-dex-desktop-os-development (10).zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and extract Development 10
        shell: bash
        run: |
          set -euo pipefail
          ZIP="kk-dex-desktop-os-development (10).zip"
          test -s "$ZIP"
          unzip -t "$ZIP"
          mkdir -p "$RUNNER_TEMP/kkdex-development-10"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/kkdex-development-10"
          ROOT="$(find "$RUNNER_TEMP/kkdex-development-10" -maxdepth 4 -type f -name package.json -printf '%h\n' | head -n 1)"
          test -n "$ROOT"
          test -d "$ROOT/android"
          test -f "$ROOT/android/settings.gradle" -o -f "$ROOT/android/settings.gradle.kts"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Development 10 source root: $ROOT"
          find "$ROOT" -maxdepth 2 -type f | sort | head -160

      - name: Fix Android 16 fullscreen startup crash and bump test version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["RUNNER_TEMP"]) / "kkdex-development-10"
          candidates = list(root.glob("*/android/app/src/main/java/com/kkdex/desktop/FullscreenController.kt"))
          if not candidates:
              candidates = list(root.glob("android/app/src/main/java/com/kkdex/desktop/FullscreenController.kt"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected one FullscreenController.kt, found {len(candidates)}")
          source = candidates[0]
          source.write_text("""package com.kkdex.desktop

          import android.app.Activity
          import android.app.Presentation
          import android.os.Build
          import android.view.View
          import android.view.Window
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import android.view.WindowManager

          /**
           * Immersive full-screen control for the TV desktop.
           *
           * Always create the decor view before asking for its insets controller.
           * PhoneWindow.insetsController can crash on Android 16 when called from
           * Activity.onCreate before PhoneWindow has created its decor view.
           */
          object FullscreenController {
              fun isEnabled(activity: Activity): Boolean =
                  activity.window.attributes.flags and WindowManager.LayoutParams.FLAG_FULLSCREEN != 0

              fun apply(activity: Activity, presentation: Presentation?, enabled: Boolean) {
                  val windows = listOfNotNull(activity.window, presentation?.window)
                  windows.forEach { window ->
                      activity.runOnUiThread {
                          // This initializes PhoneWindow.mDecor before any insets API is used.
                          val decorView = window.decorView
                          val applyPolicy = Runnable { applyToWindow(window, decorView, enabled) }
                          if (decorView.isAttachedToWindow) applyPolicy.run()
                          else decorView.post(applyPolicy)
                      }
                  }
              }

              private fun applyToWindow(window: Window, decorView: View, enabled: Boolean) {
                  if (enabled) {
                      window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                      window.addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN)
                  } else {
                      window.clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN)
                      window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  }

                  if (Build.VERSION.SDK_INT >= 30) {
                      // View.windowInsetsController safely returns null if not attached.
                      val controller = decorView.windowInsetsController
                      if (controller != null) {
                          val bars = WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars()
                          if (enabled) {
                              controller.hide(bars)
                              controller.systemBarsBehavior =
                                  WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          } else {
                              controller.show(bars)
                          }
                          return
                      }
                  }

                  @Suppress("DEPRECATION")
                  decorView.systemUiVisibility = if (enabled) {
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                          View.SYSTEM_UI_FLAG_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                          View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  } else {
                      View.SYSTEM_UI_FLAG_VISIBLE
                  }
              }

              fun restore(activity: Activity, presentation: Presentation?, enabled: Boolean) {
                  apply(activity, presentation, enabled)
              }
          }
          """.replace("\n          ", "\n"))
          print(f"Patched {source}")

          gradle = source.parents[6] / "build.gradle.kts"
          text = gradle.read_text()
          if 'versionCode = 1' not in text or 'versionName = "1.0.0"' not in text:
              raise SystemExit("Unexpected Development 10 version metadata; refusing to bump it.")
          text = text.replace("versionCode = 1", "versionCode = 2", 1)
          text = text.replace('versionName = "1.0.0"', 'versionName = "1.0.1"', 1)
          gradle.write_text(text)
          print("Set test APK version to 1.0.1 (versionCode 2).")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies and build
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "No frontend build script declared; continuing with Android build."
          fi
          if [ -f scripts/sync-android-assets.mjs ]; then
            node scripts/sync-android-assets.mjs
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Development 10 debug APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug
          else
            gradle :app:assembleDebug
          fi

      - name: Verify and package APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android -type f -path '*/build/outputs/apk/*/*.apk' ! -name '*androidTest*' | head -n 1)"
          test -n "$APK"
          mkdir -p deliverables
          cp "$APK" deliverables/KK-DEX-Development-10-Android16-Fix.apk
          sha256sum deliverables/KK-DEX-Development-10-Android16-Fix.apk | tee deliverables/SHA256SUMS.txt
          ls -lh deliverables/

      - name: Upload Development 10 Android 16 fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: KK-DEX-Development-10-Android16-Fix-APK
          path: ${{ env.PROJECT_ROOT }}/deliverables/
          if-no-files-found: error
          retention-days: 14
