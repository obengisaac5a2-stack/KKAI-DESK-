name: KK DEX Development 8 verification and APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/android-development-8.yml"
      - "kk-dex-desktop-os-development (8).zip"

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract the exact Development 8 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="kk-dex-desktop-os-development (8).zip"
          test -s "$ZIP"
          unzip -t "$ZIP"
          mkdir -p "$RUNNER_TEMP/kkdex-development-8"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/kkdex-development-8"
          ROOT="$RUNNER_TEMP/kkdex-development-8"
          test -s "$ROOT/package.json"
          test -s "$ROOT/src/App.tsx"
          test -s "$ROOT/android/app/src/main/java/com/kkdex/desktop/MainActivity.kt"
          test -s "$ROOT/android/app/src/main/java/com/kkdex/desktop/BrowserActivity.kt"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"


      - name: Remove unsafe OpenGL query from NativeBridge background thread
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          matches = list(Path(".").rglob("NativeBridge.kt"))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one NativeBridge.kt in Development 8 source, found {len(matches)}")
          path = matches[0]
          source = path.read_text()
          pattern = re.compile(r'(?:\b[A-Za-z_][A-Za-z0-9_]*\s*\.\s*)*glGetString\s*\([^)]*\)')
          source, count = pattern.subn('"unknown"', source)
          if count == 0:
              raise SystemExit(f"No glGetString call found in {path}; refusing to produce an unpatched APK")
          path.write_text(source)
          print(f"Replaced {count} unsafe OpenGL glGetString call(s) in {path}")
          PY

      - name: Repair Version 8 Android Kotlin compile errors
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          browser = Path("android/app/src/main/java/com/kkdex/desktop/BrowserActivity.kt")
          source = browser.read_text()
          replacements = {
              "ContextCompat.checkSelfPermission(this, it)": "ContextCompat.checkSelfPermission(this@BrowserActivity, it)",
              "ActivityCompat.requestPermissions(this, missing.toTypedArray(), REQUEST_GEOLOCATION)": "ActivityCompat.requestPermissions(this@BrowserActivity, missing.toTypedArray(), REQUEST_GEOLOCATION)",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"Missing expected code in BrowserActivity.kt: {old!r}")
              source = source.replace(old, new)
          browser.write_text(source)

          downloads = Path("android/app/src/main/java/com/kkdex/desktop/DownloadController.kt")
          source = downloads.read_text()
          old = "java.io.File(Environment.DIRECTORY_DOWNLOADS.let { context.filesDir }).usableSpace"
          new = "context.filesDir.usableSpace"
          if source.count(old) != 1:
              raise SystemExit("Expected the known invalid free-space expression in DownloadController.kt")
          downloads.write_text(source.replace(old, new, 1))
          # Android lint requires only READ/WRITE grant bits for takePersistableUriPermission.
          source = browser.read_text()
          old_flags = "if (flags == 0) Intent.FLAG_GRANT_READ_URI_PERMISSION else flags"
          new_flags = """(flags and (Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION)).let { grantFlags ->
                              if (grantFlags == 0) Intent.FLAG_GRANT_READ_URI_PERMISSION else grantFlags
                          }"""
          if old_flags not in source:
              raise SystemExit("Could not find the URI permission flags expression in BrowserActivity.kt")
          source = source.replace(old_flags, new_flags)
          browser.write_text(source)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          camera_permission = '<uses-permission android:name="android.permission.CAMERA"'
          camera_feature = '<uses-feature android:name="android.hardware.camera" android:required="false" />'
          if camera_permission in xml and camera_feature not in xml:
              xml = xml.replace("</manifest>", f"    {camera_feature}\n</manifest>")
              manifest.write_text(xml)
          print("Patched Activity contexts, storage free-space check, URI permission flags, and optional camera hardware declaration.")
          PY

      - name: Route APK files to the Android installer before archive handling
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/apps/AndroidApps.tsx")
          source = path.read_text()
          old = '    else if (kind === "archive") system.openApp("archives", payload);'
          new = '    else if (kind === "archive" && entry.mime !== "application/vnd.android.package-archive" && !entry.name.toLowerCase().endsWith(".apk")) system.openApp("archives", payload);'
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one archive-routing line; refusing to patch an unexpected source.")
          path.write_text(source.replace(old, new, 1))
          print("APK files now bypass Archive Manager and reach the existing Android installer confirmation.")
          PY

      - name: Add a direct APK installer to Android Apps
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/apps/AndroidApps.tsx")
          source = path.read_text()
          state_anchor = '  const [launching, setLaunching] = useState<string | null>(null);'
          if source.count(state_anchor) != 1:
              raise SystemExit("Could not locate the unique Android Apps launching state.")
          source = source.replace(state_anchor, state_anchor + '\n  const [installing, setInstalling] = useState(false);', 1)
          anchor = "  const visible = apps.filter("
          if source.count(anchor) != 1:
              raise SystemExit("Could not locate the unique installed-app filter.")
          insert_at = source.find("\n\n  if (!available)", source.find(anchor))
          if insert_at < 0:
              raise SystemExit("Could not locate the Android Apps native-availability branch.")
          handler = """  const chooseAndInstallApk = async () => {
            try {
              setInstalling(true);
              const selected = await pickFiles("*/*");
              const apk = selected.find((file) =>
                file.name.toLowerCase().endsWith(".apk") ||
                file.mime === "application/vnd.android.package-archive",
              );
              if (!apk) {
                system.notify("No APK selected", "Choose an .apk file from Android storage. No app was installed.", "appmanager");
                return;
              }
              system.setDialog({
                title: "Install " + apk.name + "?",
                message: "KK DEX will hand this APK to Android's official package installer. Review the app identity, requested permissions and Play Protect warning before approving. KK DEX cannot silently install apps or bypass Android's checks.",
                confirmLabel: "Continue to Android installer",
                onConfirm: () => {
                  void installApkUri(apk.uri)
                    .then((message) => system.notify("Android installer", message, "appmanager"))
                    .catch((cause) => report("APK installation could not start", cause));
                },
              });
            } catch (cause) {
              if (!(cause instanceof Error) || !/cancel|picker/i.test(cause.message)) {
                report("Could not choose an APK", cause);
              }
            } finally {
              setInstalling(false);
            }
          };"""
          source = source[:insert_at] + "\n\n" + handler + source[insert_at:]
          old_button = '        <button className="secondary-button" onClick={() => void load()} disabled={busy}><RefreshCw size={14} className={busy ? "spin" : ""} /> Refresh</button>'
          new_button = '''        <div className="app-manager-actions">
                  <button className="secondary-button" onClick={() => void chooseAndInstallApk()} disabled={installing}><Package size={14} /> {installing ? "Opening picker…" : "Install APK"}</button>
                  <button className="secondary-button" onClick={() => void load()} disabled={busy}><RefreshCw size={14} className={busy ? "spin" : ""} /> Refresh</button>
                </div>'''
          if source.count(old_button) != 1:
              raise SystemExit("Could not locate the unique Android Apps refresh button.")
          source = source.replace(old_button, new_button, 1)
          path.write_text(source)

          css = Path("src/index.css")
          styles = """
          /* Development 8: keep APK installation distinct from app refresh. */
          .app-manager-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
          }
          @media (max-width: 620px) {
            .app-manager .panel-heading {
              align-items: flex-start;
              flex-direction: column;
            }
            .app-manager-actions {
              justify-content: flex-start;
            }
          }
          """
          css_source = css.read_text()
          if ".app-manager-actions {" not in css_source:
              css.write_text(css_source.rstrip() + "\n\n" + styles.lstrip())
          print("Added a direct APK picker and confirmation flow to the native Android Apps manager.")
          PY

      - name: Correct Development 8 desktop density and window layout
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f"Expected one exact anchor in {path}: {old!r}")
              p.write_text(s.replace(old, new, 1))

          # Balanced initial window sizes for 960x540 and similar TV displays.
          replace_once("src/registry.ts",
              'app("pc", "This PC", "Your device and connected storage", "System", 820, 540)',
              'app("pc", "This PC", "Your device and connected storage", "System", 760, 480, 560, 340)')
          replace_once("src/registry.ts",
              '    900,\n    584,\n    620,\n    380,',
              '    780,\n    490,\n    560,\n    340,')
          replace_once("src/registry.ts",
              'app("browser", "Browser", "A window to the world", "Internet", 940, 610)',
              'app("browser", "Browser", "A window to the world", "Internet", 820, 520, 580, 350)')
          replace_once("src/registry.ts",
              '    860,\n    580,\n    640,\n    380,',
              '    760,\n    490,\n    560,\n    340,')
          
          # Compact defaults for desktop shortcuts and typography.
          replace_once("src/storage.ts", '  textScale: 1,', '  textScale: 0.9,')
          replace_once("src/storage.ts", '  iconSize: "medium",', '  iconSize: "small",')
          replace_once("src/system.tsx",
              '  const [preferences, setPreferences] = useState<Preferences>(() => ({\n    ...defaultPreferences,\n    ...readPersisted("preferences", defaultPreferences),\n  }));',
              '  const [preferences, setPreferences] = useState<Preferences>(() => {\n    const saved = { ...readPersisted<Preferences>("preferences", defaultPreferences) };\n    const densityMigrated = readPersisted("desktop-density-v106", false);\n    if (!densityMigrated) {\n      saved.textScale = 0.9;\n      saved.iconSize = "small";\n      persist("desktop-density-v106", true);\n    }\n    return { ...defaultPreferences, ...saved };\n  });')

          # Reduce taskbar reservation consistently in window geometry.
          replace_once("src/system.tsx", '...fitRect(900, 584),', '...fitRect(780, 490),')
          # Clamp restored sessions so old oversized saved windows do not reopen oversized.
          replace_once("src/system.tsx",
              '  const width = Math.max(100, Math.min(rect.width, viewportWidth - 16));',
              '  const width = Math.max(100, Math.min(rect.width, viewportWidth * 0.88, viewportWidth - 16));')
          replace_once("src/system.tsx",
              '    Math.min(rect.height, viewportHeight - TASKBAR_HEIGHT - 12),',
              '    Math.min(rect.height, viewportHeight * 0.86, viewportHeight - TASKBAR_HEIGHT - 12),')

          # Tighter shortcut grid so more apps fit without crowding.
          replace_once("src/Desktop.tsx",
              'const CELL_X = 94,\n  CELL_Y = 96,\n  LEFT = 20,\n  TOP = 26;',
              'const CELL_X = 84,\n  CELL_Y = 84,\n  LEFT = 16,\n  TOP = 18;')

          css = Path("src/index.css")
          css.write_text(css.read_text().rstrip() + """

          /* Development 8: compact, TV-friendly desktop density. */
          .desktop-icons { bottom: 56px; }
          .window-layer { bottom: 56px; }
          .taskbar { height: 56px; padding-left: 16px; padding-right: 12px; }
          .taskbar-button { width: 40px; height: 40px; }
          .taskbar-center { gap: 2px; }
          .window-titlebar { height: 38px; min-height: 38px; }
          .window-controls button { width: 38px; }
          .settings-sidebar { width: 174px; min-width: 160px; padding-top: 18px; }
          .settings-profile { margin-left: 15px; margin-right: 12px; }
          .settings-search { margin: 16px 12px 12px; }
          .settings-content { padding: 22px 24px 20px; }
          .settings-content > h1 { font-size: calc(23px * var(--text-scale, 1)); }
          .setting-row { padding: 14px 0; gap: 12px; }
          .file-sidebar { width: 156px; min-width: 156px; }
          .file-content { padding: 18px 20px; }
          .desktop-icon { width: 72px; height: 76px; padding: 6px 2px 4px; gap: 4px; }
          .desktop-icon > span:last-child { max-width: 68px; font-size: calc(10px * var(--text-scale, 1)); }
          .desktop-icon .app-icon svg, .desktop-icon > svg { width: 32px; height: 32px; }
          .desktop-icons.small .desktop-icon { height: 70px; padding-top: 6px; gap: 4px; }

          @media (max-width: 1100px), (max-height: 700px) {
            .desktop-brand { right: 22px; bottom: 76px; }
            .desktop-brand > div { font-size: calc(22px * var(--text-scale, 1)); }
            .desktop-icons, .window-layer { bottom: 56px; }
            .taskbar { height: 56px; padding-left: 12px; padding-right: 8px; }
            .taskbar-button { width: 38px; height: 38px; }
            .window-titlebar { height: 36px; min-height: 36px; }
            .window-controls button { width: 36px; }
            .window-title { padding-left: 12px; }
            .settings-sidebar { width: 160px; min-width: 150px; }
            .settings-content { padding: 18px 18px 16px; }
            .settings-content > h1 { font-size: calc(21px * var(--text-scale, 1)); }
            .settings-description { margin-bottom: 16px; }
            .setting-row { padding: 11px 0; }
            .file-sidebar { width: 146px; min-width: 146px; }
            .file-content { padding: 16px 16px; }
          }
          """)
          # Development 8: make the display scale a safe range control, defaulting to 50%.
          replace_once("src/storage.ts", '  textScale: 0.9,', '  textScale: 0.5,')
          replace_once("src/system.tsx",
              '    const densityMigrated = readPersisted("desktop-density-v106", false);\n    if (!densityMigrated) {\n      saved.textScale = 0.9;\n      saved.iconSize = "small";\n      persist("desktop-density-v106", true);\n    }',
              '    const densityMigrated = readPersisted("desktop-density-v106", false);\n    if (!densityMigrated) {\n      saved.iconSize = "small";\n      persist("desktop-density-v106", true);\n    }\n    const displayScaleMigrated = readPersisted("desktop-display-scale-v107", false);\n    if (!displayScaleMigrated) {\n      saved.textScale = 0.5;\n      persist("desktop-display-scale-v107", true);\n    }')
          replace_once("src/apps/SystemApps.tsx",
              textwrap.indent(textwrap.dedent("""
                  <select
                    aria-label="Desktop text size"
                    value={p.textScale}
                    onChange={(e) =>
                      setPreference("textScale", Number(e.target.value))
                    }
                  >
                    <option value=".9">Small (90%)</option>
                    <option value="1">Default (100%)</option>
                    <option value="1.15">Large (115%)</option>
                  </select>
              """), "              "),
              textwrap.indent(textwrap.dedent("""
                  <div className="setting-slider display-scale-slider">
                    <input
                      type="range"
                      aria-label="Desktop display scale"
                      min="50"
                      max="100"
                      step="5"
                      value={Math.round(p.textScale * 100)}
                      onChange={(e) =>
                        setPreference("textScale", Number(e.target.value) / 100)
                      }
                    />
                    <span>{Math.round(p.textScale * 100)}%</span>
                  </div>
              """), "              "))
          replace_once("tests/integration.spec.ts",
              textwrap.dedent("""
                  test("text-size settings scale real desktop and application text", async ({
                    page,
                  }) => {
                    const previous = await page
                      .locator(".file-page-heading h1")
                      .evaluate((el) => parseFloat(getComputedStyle(el).fontSize));
                    await launch(page, "settings");
                    await page
                      .getByRole("button", { name: "Display", exact: true })
                      .click();
                    await page
                      .getByRole("combobox", { name: "Desktop text size" })
                      .selectOption("1.15");
                    const changed = await page
                      .locator(".file-page-heading h1")
                      .evaluate((el) => parseFloat(getComputedStyle(el).fontSize));
                    expect(changed).toBeGreaterThan(previous);
                  });
              """),
              textwrap.dedent("""
                  test("display scale defaults to 50 percent and adjusts without a native select dialog", async ({
                    page,
                  }) => {
                    await launch(page, "settings");
                    await page
                      .getByRole("button", { name: "Display", exact: true })
                      .click();
                    const scale = page.getByRole("slider", { name: "Desktop display scale" });
                    await expect(scale).toHaveValue("50");
                    await scale.focus();
                    await page.keyboard.press("ArrowRight");
                    await expect(scale).toHaveValue("55");
                    await expect(page.locator(".display-scale-slider")).toContainText("55%");
                    const applied = await page.locator(".desktop").evaluate((el) =>
                      getComputedStyle(el).getPropertyValue("--text-scale").trim(),
                    );
                    expect(applied).toBe("0.55");
                  });
              """))
          # Replace the unsupported WebView Fullscreen API with a desktop-owned layout mode.
          replace_once("src/apps/SystemApps.tsx",
              '  const [permissionMessage, setPermissionMessage] = useState("");',
              '''  const [permissionMessage, setPermissionMessage] = useState("");
            const [fullscreenLayout, setFullscreenLayout] = useState(() =>
              document.querySelector(".desktop")?.classList.contains("fullscreen-layout") ?? false,
            );''')
          replace_once("src/apps/SystemApps.tsx",
              textwrap.dedent("""
                    <button
                      className="secondary-button"
                      onClick={async () => {
                        try {
                          if (document.fullscreenElement)
                            await document.exitFullscreen();
                          else await document.documentElement.requestFullscreen();
                        } catch {
                          explain(
                            "Full screen unavailable",
                            "This WebView does not allow full-screen requests. The Android host can enable immersive mode for the external display.",
                          );
                        }
                      }}
                    >
                      <Maximize size={14} />
                      Toggle full screen
                    </button>
              """),
              textwrap.dedent("""
                    <button
                      className="secondary-button"
                      aria-pressed={fullscreenLayout}
                      onClick={() => {
                        const desktop = document.querySelector(".desktop");
                        if (!desktop) return;
                        const enabled = desktop.classList.toggle("fullscreen-layout");
                        setFullscreenLayout(enabled);
                      }}
                    >
                      <Maximize size={14} />
                      {fullscreenLayout ? "Exit full screen" : "Toggle full screen"}
                    </button>
              """))
          css = Path("src/index.css")
          fullscreen_css = """
          /* Development 8: native-safe full-screen desktop layout (no WebView Fullscreen API). */
          .desktop.fullscreen-layout .desktop-icons {
            inset: 0 0 48px;
            display: flex;
            align-content: center;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px 12px;
            padding: 18px 24px 22px;
            overflow: auto;
          }
          .desktop.fullscreen-layout .desktop-icons .desktop-icon {
            position: relative !important;
            left: auto !important;
            top: auto !important;
            flex: 0 0 76px;
            width: 76px;
            height: 78px;
            padding: 5px 2px 3px;
          }
          .desktop.fullscreen-layout .desktop-brand { right: 22px; bottom: 58px; }
          .desktop.fullscreen-layout .taskbar { height: 48px; padding: 0 12px; }
          .desktop.fullscreen-layout .taskbar-brand,
          .desktop.fullscreen-layout .taskbar-brand-divider,
          .desktop.fullscreen-layout .taskbar-clock { display: none; }
          .desktop.fullscreen-layout .taskbar-center {
            position: static;
            transform: none;
            margin: 0 auto;
            gap: 5px;
          }
          .desktop.fullscreen-layout .taskbar-button { width: 36px; height: 36px; }
          .desktop.fullscreen-layout .window-layer { bottom: 48px; }
          @media (max-width: 620px) {
            .desktop.fullscreen-layout .desktop-icons { padding-inline: 10px; gap: 4px 6px; }
            .desktop.fullscreen-layout .desktop-icons .desktop-icon { flex-basis: 68px; width: 68px; }
          }
          """
          css_source = css.read_text()
          if "native-safe full-screen desktop layout" not in css_source:
              css.write_text(css_source.rstrip() + "\n\n" + fullscreen_css)
          replace_once("tests/integration.spec.ts",
              'test("permanent deletion requires confirmation and cannot be undone", async ({',
              '''test("full-screen desktop toggles its native-safe layout without requesting browser fullscreen", async ({
                page,
              }) => {
                await launch(page, "settings");
                await page.getByRole("button", { name: "Display", exact: true }).click();
                await page.evaluate(() => {
                  document.documentElement.requestFullscreen = async () => {
                    throw new Error("WebView fullscreen must not be called");
                  };
                });
                await page.getByRole("button", { name: "Toggle full screen" }).click();
                await expect(page.locator(".desktop")).toHaveClass(/fullscreen-layout/);
                await expect(page.getByRole("button", { name: "Exit full screen" })).toHaveAttribute("aria-pressed", "true");
                const taskbarHeight = await page.locator(".taskbar").evaluate((el) => getComputedStyle(el).height);
                expect(taskbarHeight).toBe("48px");
                await page.getByRole("button", { name: "Exit full screen" }).click();
                await expect(page.locator(".desktop")).not.toHaveClass(/fullscreen-layout/);
              });

              test("permanent deletion requires confirmation and cannot be undone", async ({''')
          print("Replaced unsupported WebView fullscreen calls with a desktop-owned centered layout and compact taskbar.")
          print("Set Development 8 display scale to 50%, replaced the native select with a range control, and added a regression test.")
          print("Applied compact TV layout, smaller defaults, and restored-window bounds.")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies and build
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          npm ci
          npm run build
          npx tsc --noEmit
          node scripts/sync-android-assets.mjs

      - name: Run browser and desktop tests
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/kkdex-vite.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:5173/ >/dev/null
          npx playwright test --reporter=list

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "Using Android SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Set the next test APK version
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          source = path.read_text()
          if "versionCode = 1" not in source or 'versionName = "1.0.0"' not in source:
              raise SystemExit("Unexpected Development 8 version; refusing to change a different source.")
          source = source.replace("versionCode = 1", "versionCode = 9", 1)
          source = source.replace('versionName = "1.0.0"', 'versionName = "1.0.7"', 1)
          path.write_text(source)
          assert "versionCode = 9" in path.read_text()
          print("Building KK DEX Development 8 version 1.0.7 (versionCode 9).")
          PY

      - name: Build and lint the Android app
        working-directory: ${{ env.PROJECT_ROOT }}/android
        shell: bash
        run: |
          set +e
          gradle :app:lintDebug :app:assembleDebug
          result=$?
          if [ "$result" -ne 0 ]; then
            echo "---- Full Android lint report ----"
            find app/build -name 'lint-results-debug.txt' -type f -exec cat {} \; || true
            exit "$result"
          fi

      - name: Verify APK and calculate checksum
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p deliverables
          cp "$APK" deliverables/kkdex-debug.apk
          sha256sum deliverables/kkdex-debug.apk | tee deliverables/kkdex-debug.apk.sha256
          ls -lh deliverables/kkdex-debug.apk

      - name: Upload Development 8 APK and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: KK-DEX-development-8-app-installer-APK-and-reports
          path: |
            ${{ env.PROJECT_ROOT }}/deliverables/kkdex-debug.apk
            ${{ env.PROJECT_ROOT }}/deliverables/kkdex-debug.apk.sha256
            ${{ env.PROJECT_ROOT }}/android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 7
