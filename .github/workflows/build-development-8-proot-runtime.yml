name: Build verified Android ARM64 PRoot runtime for Development 8

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-development-8-proot-runtime.yml"
      - "scripts/linux-runtime-build/**"

permissions:
  contents: read

jobs:
  build-proot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned upstream sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proot-sources" "$RUNNER_TEMP/proot-output"
          cd "$RUNNER_TEMP/proot-sources"
          curl -fL --retry 3 -o android-ndk-r27c-linux.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          curl -fL --retry 3 -o talloc-2.5.0.tar.gz https://www.samba.org/ftp/talloc/talloc-2.5.0.tar.gz
          curl -fL --retry 3 -o proot-5.1.107.96.zip https://github.com/termux/proot/archive/refs/tags/v5.1.107.96.zip
          curl -fL --retry 3 -o libandroid-shmem-0.7.tar.gz https://github.com/termux/libandroid-shmem/archive/refs/tags/v0.7.tar.gz
          printf '%s  %s\n' \
            59c2f6dc96743b5daf5d1626684640b20a6bd2b1d85b13156b90333741bad5cc android-ndk-r27c-linux.zip \
            912afa237510ae542a7733998eb18a12bcda35ab6729c8e2ddb43e8d0ebab007 talloc-2.5.0.tar.gz \
            75f654fe60dea92dabff2bf083ae8bfe4f91baa6a1a374786a6bf391015eebaa proot-5.1.107.96.zip \
            1e5ff8459bc0a8c229dd8a94b27d119987e09ef3414331c2b5ebfff20b98e867 libandroid-shmem-0.7.tar.gz | sha256sum -c -
      - name: Build PRoot and Android loader from source
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -t kkdex-proot-build scripts/linux-runtime-build
          docker run --rm --platform linux/amd64 -e PROOT_PLAIN=1 \
            -v "$RUNNER_TEMP/proot-sources:/dl:ro" \
            -v "$GITHUB_WORKSPACE/scripts/linux-runtime-build:/dl-stops:ro" \
            -v "$RUNNER_TEMP/proot-output:/out" kkdex-proot-build
          test -s "$RUNNER_TEMP/proot-output/libproot.so"
          test -s "$RUNNER_TEMP/proot-output/libproot-loader.so"
          test -s "$RUNNER_TEMP/proot-output/libtalloc.so"
          cat "$RUNNER_TEMP/proot-output/SHA256SUMS"
      - name: Verify the pinned Debian Trixie ARM64 root filesystem
        shell: bash
        run: |
          set -euo pipefail
          source scripts/linux-runtime-build/debian-rootfs.lock
          curl -fL --retry 3 "$DEBIAN_ROOTFS_URL" -o "$RUNNER_TEMP/debian-rootfs.tar.gz"
          echo "$DEBIAN_ROOTFS_SHA256  $RUNNER_TEMP/debian-rootfs.tar.gz" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/debian-rootfs.tar.gz")" = "$DEBIAN_ROOTFS_BYTES"
          tar -tzf "$RUNNER_TEMP/debian-rootfs.tar.gz" | grep -E '^(etc/os-release|usr/bin/apt-get|usr/bin/dpkg|bin/bash)
          path: |
            ${{ runner.temp }}/proot-output/libproot.so
            ${{ runner.temp }}/proot-output/libproot-loader.so
            ${{ runner.temp }}/proot-output/libtalloc.so
            ${{ runner.temp }}/proot-output/SHA256SUMS
            ${{ runner.temp }}/proot-output/COPYING.proot
            ${{ runner.temp }}/proot-output/LICENSE.talloc
            ${{ runner.temp }}/proot-output/LICENSE.libandroid-shmem
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: KK-DEX-development-8-proot-arm64-runtime
          path: |
            ${{ runner.temp }}/proot-output/libproot.so
            ${{ runner.temp }}/proot-output/libproot-loader.so
            ${{ runner.temp }}/proot-output/libtalloc.so
            ${{ runner.temp }}/proot-output/SHA256SUMS
            ${{ runner.temp }}/proot-output/COPYING.proot
            ${{ runner.temp }}/proot-output/LICENSE.talloc
            ${{ runner.temp }}/proot-output/LICENSE.libandroid-shmem
          if-no-files-found: error
          retention-days: 14
